# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test against both major version of Shapely for all supported Python version. Shapely v1 will not build
        # on Python >= 3.12 so we exclude that from our testing.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        shapely-version: ["1.*", "2.*"]
        exclude:
          - python-version: "3.12"
            shapely-version: "1.*"
          - python-version: "3.13"
            shapely-version: "1.*"
          - python-version: "3.14"
            shapely-version: "1.*"

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OS dependencies
        run: |
          sudo apt-get install -y libgeos-dev
      - name: Enforce Shapely constraints
        run: |
          echo "shapely == ${{ matrix.shapely-version }}" | tee > constraints.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest mypy
          pip install -r requirements.txt -c constraints.txt
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --show-source --statistics
      - name: Test with pytest
        run: |
          pytest
      - name: Type checking
        run: |
          mypy -p polygon_geohasher
